name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/m:ro" -w /m koalaman/shellcheck:stable -x -S style
          install.sh teste/rodar.sh teste/comum.sh docs/demo/capturar.sh docs/demo/gravar.sh docs/demo/ambiente.sh

  instalacao:
    name: instalação no ${{ matrix.nome }}
    needs: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: "24.04"
            nome: Ubuntu 24.04
          - sistema: "26.04"
            nome: Ubuntu 26.04
          - sistema: debian-13
            nome: Debian 13
    steps:
      - uses: actions/checkout@v5
      # Um servidor descartável com systemd num container privilegiado: as recusas (redes cruzadas, disco dos
      # bancos), --checar, instalação completa e uma segunda execução que não pode mudar nada.
      - name: instalação completa num servidor descartável
        run: teste/rodar.sh "${{ matrix.sistema }}"
